# Jandí -- Suco verde
#
# O mesmo pigmento antes do ar: o fundo é a polpa fresca, o texto é a tinta
# já oxidada. O urucum escurece pra continuar legível na luz. Oby, o azul
# tupi, não serve de muted aqui (2.8:1 sobre o suco verde) -- por isso o
# muted é um passo mais fundo, na mesma família.

mode = "light"

accent    = "#963A16"   # urucum, aprofundado pra luz            4.8:1
selection = "#8FA7B3"   # Brisa -- a oxidação começando
muted     = "#46627A"   # entre Oby e Genipina                   4.2:1

background         = "#C8D5CC"   # Suco verde -- a polpa fresca
dark_background    = "#B6C6BC"
darker_background  = "#A6B8AD"
lighter_background = "#D9E3DC"

foreground        = "#11203A"   # Yandí -- a tinta concentrada     10.7:1
dark_foreground   = "#2C4A6E"   # Genipina
light_foreground  = "#46627A"
bright_foreground = "#0A1424"   # Tinta de guerra

red     = "#9E3424"   # urucum fundo                            4.7:1
orange  = "#94481A"   # semente de urucum                       4.3:1
yellow  = "#7A5A10"   # polpa madura                            4.2:1
green   = "#3D6A3F"   # folha do jenipapeiro                    4.2:1
cyan    = "#2E6A70"   # Oby fundo                               4.1:1
blue    = "#2C4A6E"   # Genipina                                6.0:1
magenta = "#6E3F78"   # açaí                                    5.2:1
brown   = "#6A4A28"   # casca do fruto                          5.3:1

bright_red     = "#7E2618"
bright_yellow  = "#5E440A"
bright_green   = "#2C5230"
bright_cyan    = "#1F5257"
bright_blue    = "#1E3452"   # Nhandí
bright_magenta = "#57305F"

hyprland_active_border   = "#963A16"
hyprland_inactive_border = "#8FA7B3"
